<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldle Clone: Country Guesser</title>
    <style>
        :root {
            --bg-color: #121213;
            --panel-color: #1a1a1c;
            --text-color: #ffffff;
            --text-secondary: #818384;
            --border-color: #3a3a3c;
            --accent-green: #538d4e;
            --accent-red: #ba3c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        select {
            flex: 1;
            padding: 14px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--text-secondary);
        }

        button {
            padding: 14px 24px;
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .rows-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 15px;
            animation: slideIn 0.3s ease-out;
        }

        .row.correct {
            border-color: var(--accent-green);
            background-color: rgba(83, 141, 78, 0.2);
        }

        .row-part {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-banner {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin-top: 15px;
            min-height: 27px;
        }

        .status-banner.win { color: var(--accent-green); }
        .status-banner.lose { color: var(--accent-red); }

        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="game-card">
    <header>
        <h1>WORLDLE</h1>
        <div class="subtitle">Guess the hidden country within 6 attempts</div>
    </header>

    <div class="input-group">
        <select id="countrySelector">
            <option value="" disabled selected>Select a country...</option>
        </select>
        <button id="submitBtn" onclick="submitGuess()">GUESS</button>
    </div>

    <div class="rows-container" id="rowsContainer"></div>
    <div class="status-banner" id="statusBanner"></div>
</div>

<script>
    // Comprehensive geographical dataset
    const countryDataset = [
        { name: "Argentina", lat: -38.4161, lon: -63.6167 },
        { name: "Australia", lat: -25.2744, lon: 133.7751 },
        { name: "Brazil", lat: -14.2350, lon: -51.9253 },
        { name: "Canada", lat: 56.1304, lon: -106.3468 },
        { name: "China", lat: 35.8617, lon: 104.1954 },
        { name: "Egypt", lat: 26.8206, lon: 30.8025 },
        { name: "France", lat: 46.2276, lon: 2.2137 },
        { name: "Germany", lat: 51.1657, lon: 10.4515 },
        { name: "India", lat: 20.5937, lon: 78.9629 },
        { name: "Italy", lat: 41.8719, lon: 12.5674 },
        { name: "Japan", lat: 36.2048, lon: 138.2529 },
        { name: "Mexico", lat: 23.6345, lon: -102.5528 },
        { name: "Nigeria", lat: 9.0820, lon: 8.6753 },
        { name: "South Africa", lat: -30.5595, lon: 22.9375 },
        { name: "United Kingdom", lat: 55.3781, lon: -3.4360 },
        { name: "United States", lat: 37.0902, lon: -95.7129 }
    ];

    let targetCountry;
    let currentAttempt = 0;
    const maxAttempts = 6;

    function initGame() {
        // Alphabetize the selection array
        countryDataset.sort((a, b) => a.name.localeCompare(b.name));
        
        const selector = document.getElementById("countrySelector");
        countryDataset.forEach(country => {
            const option = document.createElement("option");
            option.value = country.name;
            option.textContent = country.name;
            selector.appendChild(option);
        });

        // Select a random target country
        targetCountry = countryDataset[Math.floor(Math.random() * countryDataset.length)];
    }

    // Haversine Formula for distance tracking
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const EarthRadiusKm = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
                  
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return Math.round(EarthRadiusKm * c);
    }

    // Bearing mapping to find compass layout directions
    function calculateBearingDirection(lat1, lon1, lat2, lon2) {
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const rLat1 = lat1 * Math.PI / 180;
        const rLat2 = lat2 * Math.PI / 180;

        const y = Math.sin(dLon) * Math.cos(rLat2);
        const x = Math.cos(rLat1) * Math.sin(rLat2) - Math.sin(rLat1) * Math.cos(rLat2) * Math.cos(dLon);
        
        let bearing = Math.atan2(y, x) * 180 / Math.PI;
        bearing = (bearing + 360) % 360;

        const compassDirections = ["⬆️ N", "↗️ NE", "➡️ E", "↘️ SE", "⬇️ S", "↙️ SW", "⬅️ W", "↖️ NW"];
        const index = Math.round(bearing / 45) % 8;
        return compassDirections[index];
    }

    function submitGuess() {
        const selector = document.getElementById("countrySelector");
        const selectedGuess = selector.value;
        
        if (!selectedGuess) return;

        currentAttempt++;
        const guessedCountry = countryDataset.find(c => c.name === selectedGuess);
        const container = document.getElementById("rowsContainer");

        // Remove the selected option so the user can't accidentally pick it again
        const selectedIndex = selector.selectedIndex;
        selector.remove(selectedIndex);
        selector.value = ""; 

        if (selectedGuess === targetCountry.name) {
            container.innerHTML += `
                <div class="row correct">
                    <span>🎉 ${selectedGuess}</span>
                    <span>0 km</span>
                    <span>🎯 Target</span>
                </div>`;
            handleGameOver(true);
            return;
        }

        const distance = calculateDistance(guessedCountry.lat, guessedCountry.lon, targetCountry.lat, targetCountry.lon);
        const direction = calculateBearingDirection(guessedCountry.lat, guessedCountry.lon, targetCountry.lat, targetCountry.lon);

        container.innerHTML += `
            <div class="row">
                <span>🌍 ${selectedGuess}</span>
                <div class="row-part">
                    <span>${distance.toLocaleString()} km</span>
                    <span>${direction}</span>
                </div>
            </div>`;

        if (currentAttempt >= maxAttempts) {
            handleGameOver(false);
        }
    }

    function handleGameOver(won) {
        document.getElementById("submitBtn").disabled = true;
        document.getElementById("countrySelector").disabled = true;
        const banner = document.getElementById("statusBanner");

        if (won) {
            banner.className = "status-banner win";
            banner.textContent = `Victory! You solved it in ${currentAttempt}/${maxAttempts} tries!`;
        } else {
            banner.className = "status-banner lose";
            banner.innerHTML = `Game Over! The target was: <strong>${targetCountry.name}</strong>`;
        }
    }

    window.onload = initGame;
</script>

</body>
</html>
